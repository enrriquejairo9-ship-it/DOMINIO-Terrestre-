
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DOMINIO TERRESTRE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ab8c8;font-family:Arial,sans-serif;touch-action:none}
#renderCanvas{width:100%;height:100%;display:block;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:1px 2px 3px #000}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.panel{background:#101820d9;border:1px solid #ffffff55;border-radius:9px;padding:9px 12px;font-size:12px}
#mission{position:absolute;top:76px;left:12px}
#status{color:#b4ff9f}
#joystick{position:absolute;left:25px;bottom:35px;width:112px;height:112px;border:2px solid #ffffff90;border-radius:50%;background:#14222b70;pointer-events:auto}
#stick{position:absolute;left:32px;top:32px;width:44px;height:44px;border-radius:50%;background:#e5edf2dd;border:2px solid white}
#capture{position:absolute;right:22px;bottom:42px;width:85px;height:85px;border-radius:50%;background:#a47b25e8;border:3px solid white;color:white;font-weight:bold;pointer-events:auto}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:#0008;padding:6px 9px;border-radius:8px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#172c38;color:white;z-index:10;text-align:center}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="loading">
 <div>
  <h2>DOMINIO TERRESTRE</h2>
  <p id="loadingText">Preparando mundo 3D...</p>
 </div>
</div>

<div id="hud">
 <div class="top">
  <div class="panel"><b>DOMINIO TERRESTRE</b><br>OPERACIÓN: TIERRA ALTA</div>
  <div class="panel">ZONA: <span id="zone">NEUTRAL</span><br>CONTROL: <span id="progress">0%</span></div>
 </div>
 <div id="mission" class="panel">OBJETIVO<br>Captura la zona marcada.<br><span id="status">Zona neutral</span></div>
 <div id="joystick"><div id="stick"></div></div>
 <button id="capture">CAPTURAR</button>
 <div id="hint">Joystick para moverte · Arrastra para mirar</div>
</div>

<script>
(function(){
const loading=document.getElementById("loading");
const loadingText=document.getElementById("loadingText");

if(!window.BABYLON){
 loadingText.textContent="No se pudo cargar Babylon.js. Comprueba tu conexión.";
 setTimeout(()=>loading.style.display="none",5000);
 return;
}

try{
const canvas=document.getElementById("renderCanvas");
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true});
engine.setHardwareScalingLevel(1.5);

const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(.58,.73,.82,1);
scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity=.0025;
scene.fogColor=new BABYLON.Color3(.65,.75,.78);

function makeMat(name,color){
 const m=new BABYLON.StandardMaterial(name,scene);
 m.diffuseColor=BABYLON.Color3.FromHexString(color);
 return m;
}

const grass=makeMat("Hierba","#697e4b");
const rock=makeMat("Piedra","#777a73");
const trunk=makeMat("Tronco","#594332");
const leaves=makeMat("Follaje","#405b38");
const leaves2=makeMat("Follaje claro","#687d47");
const concrete=makeMat("Concreto","#85877f");
const roof=makeMat("Techo","#505b5d");
const glass=makeMat("Ventanas","#7299a7");
const roadMat=makeMat("Carretera","#414849");
const lineMat=makeMat("Marcas carretera","#d5d3b8");
const flagMat=makeMat("Bandera","#e5ba45");
const zoneMat=makeMat("Zona de captura","#50b8ff");

const hemi=new BABYLON.HemisphericLight("Luz ambiente",new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=.9;
const sun=new BABYLON.DirectionalLight("Sol",new BABYLON.Vector3(-.45,-1,.35),scene);
sun.position=new BABYLON.Vector3(80,120,-60);
sun.intensity=1.1;

const ground=BABYLON.MeshBuilder.CreateGround("Terreno",{width:420,height:420,subdivisions:45},scene);
ground.material=grass;

const positions=ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
for(let i=0;i<positions.length;i+=3){
 const x=positions[i],z=positions[i+2];
 positions[i+1]=Math.sin(x*.045)*.45+Math.cos(z*.038)*.55+Math.sin((x+z)*.025)*.5;
}
ground.updateVerticesData(BABYLON.VertexBuffer.PositionKind,positions);
ground.createNormals(true);

function box(name,x,y,z,w,h,d,material){
 const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);
 m.position.set(x,y+h/2,z);
 m.material=material;
 return m;
}

function makeTree(x,z,size=1){
 const y=Math.sin(x*.045)*.45+Math.cos(z*.038)*.55+Math.sin((x+z)*.025)*.5;
 const t=BABYLON.MeshBuilder.CreateCylinder("Tronco",{height:2*size,diameterTop:.2*size,diameterBottom:.4*size,tessellation:6},scene);
 t.position.set(x,y+size,z);
 t.material=trunk;
 const c=BABYLON.MeshBuilder.CreateCylinder("Copa",{height:3.2*size,diameterTop:.05*size,diameterBottom:2.4*size,tessellation:7},scene);
 c.position.set(x,y+2.6*size,z);
 c.material=Math.random()>.5?leaves:leaves2;
}

function building(x,z,w,d,h){
 box("Edificio",x,.2,z,w,h,d,concrete);
 box("Techo",x,h+.2,z,w+.5,.3,d+.5,roof);
 for(let xx=-w/2+1;xx<w/2;xx+=2){
  box("Ventana",x+xx,h*.55+.2,z-d/2-.04,.7,.8,.06,glass);
 }
 box("Puerta",x,.9,z+d/2+.05,1.1,1.8,.08,roof);
}

function road(x,z,w,d){
 box("Carretera",x,.05,z,w,.12,d,roadMat);
 if(w>d){
  for(let p=-w/2+4;p<w/2;p+=8)box("Marca",x+p,.13,z,3,.025,.14,lineMat);
 }else{
  for(let p=-d/2+4;p<d/2;p+=8)box("Marca",x,.13,z+p,.14,.025,3,lineMat);
 }
}

road(0,0,12,250);
road(30,18,95,7);
road(-35,-38,7,100);

building(-13,12,10,9,4.5);
building(15,25,12,10,5);
building(40,5,10,12,4);
building(-32,-18,13,9,4.5);
building(28,-45,12,10,5);

for(let i=0;i<26;i++){
 const a=i/26*Math.PI*2;
 const r=175+Math.random()*22;
 const h=18+Math.random()*27;
 const mountain=BABYLON.MeshBuilder.CreateCylinder("Montaña",{height:h,diameterTop:5,diameterBottom:28+Math.random()*20,tessellation:7},scene);
 mountain.position.set(Math.cos(a)*r,h/2-2,Math.sin(a)*r);
 mountain.material=i%3===0?rock:grass;
}

for(let i=0;i<130;i++){
 const x=(Math.random()-.5)*350;
 const z=(Math.random()-.5)*350;
 if(Math.abs(x)<10)continue;
 makeTree(x,z,.7+Math.random()*.55);
}


const zoneX=0,zoneZ=48;

const zoneBase=BABYLON.MeshBuilder.CreateCylinder(
 "Zona",{diameter:17,height:.18,tessellation:32},scene
);
zoneBase.position.set(zoneX,.4,zoneZ);
zoneBase.material=zoneMat;

const ring=BABYLON.MeshBuilder.CreateTorus(
 "Anillo",{diameter:18,thickness:.35,tessellation:32},scene
);
ring.position.set(zoneX,.65,zoneZ);
ring.material=flagMat;

box("Poste",zoneX,.6,zoneZ,.15,5,.15,roof);

const flag=BABYLON.MeshBuilder.CreatePlane(
 "Bandera",{width:2.5,height:1.35},scene
);
flag.position.set(zoneX+1.2,4.5,zoneZ);
flag.material=flagMat;

// CARGAR EL ÁRBOL GLB CON LA TEXTURA SOLICITADA
BABYLON.SceneLoader.ImportMesh(
 "",
 "./",
 "anime_jrpg_buttress_camphor_tree_GAME.glb",
 scene,
 function(meshes){
  console.log("Árbol GLB cargado:",meshes.length);

  var material=new BABYLON.StandardMaterial("material",scene);
  material.diffuseTexture=new BABYLON.Texture(
   "marco-gráfico-antiguo-grano-decorativo.jpg",
   scene,
   false,
   false,
   BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
   undefined,
   function(){console.warn("No se pudo cargar el JPG");}
  );

  meshes.forEach(function(mesh){
   if(mesh.getTotalVertices&&mesh.getTotalVertices()>0){
    mesh.material=material;
   }
  });
 },
 null,
 function(scene,message,error){
  console.error("Error cargando el GLB:",message,error);
 }
);

// PERSONAJE
const player=new BABYLON.TransformNode("Jugador",scene);

const body=BABYLON.MeshBuilder.CreateCapsule(
 "Soldado",{height:1.8,radius:.38},scene
);
body.parent=player;
body.position.y=1;
body.material=makeMat("Uniforme","#4c5946");

const head=BABYLON.MeshBuilder.CreateSphere(
 "Cabeza",{diameter:.52,segments:10},scene
);
head.parent=player;
head.position.y=2.05;
head.material=makeMat("Piel","#bd9676");

const helmet=BABYLON.MeshBuilder.CreateSphere(
 "Casco",{diameter:.58,segments:8},scene
);
helmet.parent=player;
helmet.position.y=2.25;
helmet.scaling.y=.55;
helmet.material=makeMat("Casco verde","#3f4c3c");

player.position.set(0,.2,-25);

// CÁMARA
const camera=new BABYLON.FollowCamera(
 "Camara",new BABYLON.Vector3(0,7,-14),scene
);
camera.lockedTarget=player;
camera.radius=12;
camera.heightOffset=5;
camera.rotationOffset=180;
camera.cameraAcceleration=.05;
camera.maxCameraSpeed=10;
camera.lowerRadiusLimit=8;
camera.upperRadiusLimit=17;
scene.activeCamera=camera;

// JOYSTICK
let moveX=0,moveY=0;
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickUpdate(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=36,len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 stick.style.left=(34+dx)+"px";
 stick.style.top=(34+dy)+"px";
 moveX=dx/max;
 moveY=dy/max;
}

joystick.addEventListener("pointerdown",e=>{
 joystick.setPointerCapture(e.pointerId);
 joystickUpdate(e);
});

joystick.addEventListener("pointermove",e=>{
 if(e.buttons)joystickUpdate(e);
});

function resetStick(){
 moveX=0;
 moveY=0;
 stick.style.left="32px";
 stick.style.top="32px";
}

joystick.addEventListener("pointerup",resetStick);
joystick.addEventListener("pointercancel",resetStick);

// MIRAR CON EL DEDO
let dragging=false,lastX=0,lastY=0;

canvas.addEventListener("pointerdown",e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
});

canvas.addEventListener("pointermove",e=>{
 if(!dragging)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 camera.rotationOffset-=dx*.35;
 camera.heightOffset=Math.max(
  2.5,Math.min(10,camera.heightOffset+dy*.035)
 );

 lastX=e.clientX;
 lastY=e.clientY;
});

canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

// TECLADO
const keys={};

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

// CAPTURAR LA ZONA
let progress=0,captured=false;

document.getElementById("capture").addEventListener("pointerdown",e=>{
 e.preventDefault();

 const distance=Math.hypot(
  player.position.x-zoneX,
  player.position.z-zoneZ
 );

 if(distance>13){
  document.getElementById("status").textContent="Acércate a la zona";
  return;
 }

 if(captured)return;

 progress=Math.min(100,progress+25);
 document.getElementById("progress").textContent=progress+"%";

 if(progress>=100){
  captured=true;
  document.getElementById("zone").textContent="CAPTURADA";
  document.getElementById("status").textContent="¡Zona capturada!";

  const capturedMat=makeMat("Zona controlada","#36c66a");
  zoneBase.material=capturedMat;
  ring.material=capturedMat;
 }else{
  document.getElementById("status").textContent="Capturando...";
 }
});

// INICIAR EL JUEGO
let lastTime=performance.now();

engine.runRenderLoop(()=>{
 const now=performance.now();
 const dt=Math.min((now-lastTime)/1000,.05);
 lastTime=now;

 const forward=
  (keys.w||keys.arrowup?1:0)-
  (keys.s||keys.arrowdown?1:0)-moveY;

 const side=
  (keys.d||keys.arrowright?1:0)-
  (keys.a||keys.arrowleft?1:0)+moveX;

 const mag=Math.hypot(forward,side);

 if(mag>.08){
  const angle=camera.rotationOffset*Math.PI/180;
  const fx=Math.sin(angle),fz=Math.cos(angle);
  const rx=Math.cos(angle),rz=-Math.sin(angle);

  const dx=(fx*forward+rx*side)/Math.max(1,mag);
  const dz=(fz*forward+rz*side)/Math.max(1,mag);

  player.position.x+=dx*7*dt;
  player.position.z+=dz*7*dt;
  player.rotation.y=Math.atan2(dx,dz);
 }

 player.position.y=.2+
  Math.sin(player.position.x*.045)*.45+
  Math.cos(player.position.z*.038)*.55+
  Math.sin((player.position.x+player.position.z)*.025)*.5;

 scene.render();
});

// No esperar al GLB para mostrar el mundo.
engine.resize();
loading.style.display="none";

window.addEventListener("resize",()=>engine.resize());

}catch(error){
 console.error("Error al iniciar el juego:",error);
 loadingText.textContent="Error al iniciar el mundo 3D.";
 setTimeout(()=>loading.style.display="none",3000);
}
})();
</script>
</body>
</html>
